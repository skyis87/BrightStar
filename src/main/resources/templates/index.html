<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar｜ログイン</title>
  
  <!-- Bootstrap 5 CSS (使用穩定版本 5.3.3) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Thymeleaf 靜態資源引用 -->
  <link rel="stylesheet" th:href="@{/css/common.css}" href="common.css">
  <link rel="stylesheet" th:href="@{/css/index.css}" href="index.css">
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script th:src="@{/js/index.js}" src="js/index.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-area">
      <div class="logo mb-4">Brightstar</div>
      <div class="small-title">INTERNAL PORTAL</div>
      <h1 class="login-title">ログイン</h1>
      <p class="login-text">社員番号とパスワードを入力してください。</p>

      <form id="loginForm">
        <div class="input-box mb-3">
          <label for="username" class="form-label">社員番号</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="社員番号を入力" autocomplete="username" required>
        </div>

        <div class="input-box mb-3">
          <label for="password" class="form-label">パスワード</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="パスワードを入力" autocomplete="current-password" required>
        </div>

        <div id="msg" class="msg-box" aria-live="polite"></div>
        <button type="submit" id="confirmBtn" class="btn main-btn w-100 py-3 mt-2">ログイン</button>
      </form>
    </section>
  </main>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

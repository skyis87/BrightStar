<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar｜ログイン</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/common.css}" href="common.css">
  <link rel="stylesheet" th:href="@{/css/index.css}" href="index.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script th:src="@{/js/index.js}" src="/js/index.js" defer></script>
</head>
<body>
  <main class="login-page container-fluid p-0">
    <div class="row g-0 min-vh-100">
      <div class="col-md-6 login-photo" aria-label="Brightstar メイン画像"></div>

      <div class="col-md-6 d-flex align-items-center justify-content-center p-4 p-lg-5">
        <section class="login-area">
          <div class="logo mb-4">Brightstar</div>
          <div class="small-title">INTERNAL PORTAL</div>
          <h1 class="login-title">ログイン</h1>
          <p class="login-text">社員番号とパスワードを入力してください。</p>

          <form id="loginForm">
            <div class="input-box mb-3">
              <label for="username" class="form-label">社員番号</label>
              <input type="text" class="form-control" id="username" placeholder="社員番号を入力" autocomplete="username">
            </div>

            <div class="input-box mb-3">
              <label for="password" class="form-label">パスワード</label>
              <input type="password" class="form-control" id="password" placeholder="パスワードを入力" autocomplete="current-password">
            </div>

            <div id="msg" class="msg-box" aria-live="polite"></div>
            <button type="button" id="confirmBtn" class="btn main-btn w-100 py-3 mt-2">ログイン</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

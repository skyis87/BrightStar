    <!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BrightStar - 編輯公告</title>
    <link rel="stylesheet" th:href="@{/css/brightStaroshiraseForm.css}" href="/css/brightStaroshiraseForm.css">
    <link rel="stylesheet" th:href="@{/css/portalHome.css}" href="/css/portalHome.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="portal-container">
        <header class="portal-header">
            <h1>編輯公告</h1>
            <div class="user-actions">
                <a href="/brightStaroshirase" class="btn-back">返回公告列表</a>
            </div>
        </header>

        <div class="form-container">
            <form id="editForm">
                <div class="form-group">
                    <label>大標題 <span class="required">*</span></label>
                    <input type="text" id="mainTitle" placeholder="請輸入大標題" required>
                </div>

                <div class="form-group">
                    <label>小標題</label>
                    <input type="text" id="subTitle" placeholder="請輸入小標題（選填）">
                </div>

                <div class="form-group">
                    <label>分類 <span class="required">*</span></label>
                    <input type="text" id="category" placeholder="例如: GA, HR, 系統" required>
                </div>

                <div class="form-group">
                    <label>發布日期 <span class="required">*</span></label>
                    <input type="date" id="publishDate" required>
                </div>

                <div class="form-group">
                    <label>公告內容 <span class="required">*</span></label>
                    <textarea id="content" placeholder="請輸入詳細公告內容..." rows="8" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-confirm">確認修改</button>
                    <a href="/brightStaroshirase" class="btn-cancel">取消</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // 1. 取得網址列的 id 參數 (例如 ?id=3)
            const urlParams = new URLSearchParams(window.location.search);
            const noticeId = urlParams.get('id');

            if (!noticeId) {
                alert('缺少公告 ID！');
                window.location.href = '/brightStaroshirase';
                return;
            }

            // 2. 頁面載入時，發送 GET 請求取得舊資料並回填
            $.ajax({
                url: '/api/notices/' + noticeId + '/edit',
                type: 'GET',
                success: function(item) {
                    if (item) {
                        $('#mainTitle').val(item.mainTitle || '');
                        $('#subTitle').val(item.subTitle || '');
                        $('#category').val(item.category || '');
                        if (item.publishDate) {
                            $('#publishDate').val(item.publishDate.split('T')[0]);
                        }
                        $('#content').val(item.content || '');
                    } else {
                        alert('找不到該筆公告資料');
                        window.location.href = '/brightStaroshirase';
                    }
                },
                error: function() {
                    alert('載入公告資料失敗，請檢查網路或伺服器狀態。');
                }
            });

            // 3. 表單提交 (PUT 更新)
            $('#editForm').submit(function(e) {
                e.preventDefault();
                const noticeData = {
                    mainTitle: $('#mainTitle').val(),
                    subTitle: $('#subTitle').val(),
                    category: $('#category').val(),
                    publishDate: $('#publishDate').val(),
                    content: $('#content').val()
                };

                $.ajax({
                    url: '/api/notices/' + noticeId,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(noticeData),
                    success: function(res) {
                        alert(res.message);
                        if (res.success) {
                            window.location.href = '/brightStaroshirase'; // 成功後跳轉回列表頁
                        }
                    },
                    error: function() {
                        alert('更新失敗，請檢查網路或伺服器狀態。');
                    }
                });
            });
        });
    </script>
</body>
</html>

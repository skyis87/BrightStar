<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar｜お知らせ編集</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/common.css}" href="common.css">
  <link rel="stylesheet" th:href="@{/css/brightStaroshiraseForm.css}" href="brightStaroshiraseForm.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <header class="top d-flex align-items-center justify-content-between">
    <a th:href="@{/portalHome}" href="portalHome.html" class="logo">Brightstar</a>
    <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="back-btn">← 一覧へ戻る</a>
  </header>

  <main class="form-bg">
    <section class="form-box">
      <h1 class="form-title">お知らせ編集</h1>
      <p class="form-text">登録済みのお知らせ内容を変更します。</p>

      <!-- 1. 加上 enctype 支援檔案上傳 -->
      <form id="editForm" enctype="multipart/form-data">
        <div class="input-box">
          <label for="mainTitle" class="form-label">タイトル <span class="must">*</span></label>
          <input type="text" id="mainTitle" name="mainTitle" class="form-control" placeholder="タイトルを入力" required>
        </div>

        <div class="input-box">
          <label for="subTitle" class="form-label">サブタイトル</label>
          <input type="text" id="subTitle" name="subTitle" class="form-control" placeholder="サブタイトルを入力（任意）">
        </div>

        <div class="row g-3">
          <div class="col-md-6 input-box">
            <label for="category" class="form-label">分類 <span class="must">*</span></label>
            <input type="text" id="category" name="category" class="form-control" placeholder="例：総務、社内連絡" required>
          </div>
          <div class="col-md-6 input-box">
            <label for="publishDate" class="form-label">公開日 <span class="must">*</span></label>
            <input type="date" id="publishDate" name="publishDate" class="form-control" required>
          </div>
        </div>

        <div class="input-box">
          <label for="content" class="form-label">本文 <span class="must">*</span></label>
          <textarea id="content" name="content" class="form-control" placeholder="お知らせの本文を入力" required></textarea>
        </div>

        <!-- 2. 新增：顯示現有附件與上傳新檔案的欄位 -->
        <div class="input-box">
          <label class="form-label">添付ファイル</label>
          <div id="currentFileBox" class="mb-2 text-muted" style="font-size: 0.9rem; display: none;">
            現在の添付ファイル：<a id="currentFileLink" href="#" target="_blank"></a>
          </div>
          <input type="file" id="file" name="file" class="form-control">
          <div class="form-text">※新しいファイルを選択した場合、既存のファイルは上書きされます。</div>
        </div>

        <div class="form-buttons d-flex flex-wrap gap-2">
          <button type="submit" class="btn main-btn px-4">変更する</button>
          <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="btn sub-btn px-4">キャンセル</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="bottom d-flex align-items-center justify-content-between">
    <div class="bottom-logo">Brightstar</div>
    <div>© Brightstar</div>
  </footer>

  <script>
    $(function () {
      const noticeId = new URLSearchParams(window.location.search).get("id");

      if (window.location.protocol === "file:") {
        setForm({
          mainTitle: "社内イベント開催のお知らせ",
          subTitle: "参加申込みについて",
          category: "社内連絡",
          publishDate: "2026-09-10",
          content: "社内イベントの開催についてお知らせします。"
        });
        return;
      }

      if (!noticeId) {
        alert("お知らせIDがありません。");
        window.location.href = "/brightStaroshirase";
        return;
      }

      // 取得原本的資料並填入表單
      $.ajax({
        url: "/api/notices/" + noticeId + "/edit",
        type: "GET",
        success: function (item) {
          if (item) setForm(item);
          else alert("お知らせが見つかりません。");
        },
        error: function () {
          alert("お知らせの取得に失敗しました。");
        }
      });

      // 3. 提交修改表單（改用 FormData 傳送）
      $("#editForm").on("submit", function (event) {
        event.preventDefault();

        if (window.location.protocol === "file:") {
          alert("サンプル画面のため変更処理は行いません。");
          return;
        }

        const formData = new FormData();
        formData.append("mainTitle", $("#mainTitle").val());
        formData.append("subTitle", $("#subTitle").val());
        formData.append("category", $("#category").val());
        formData.append("publishDate", $("#publishDate").val());
        formData.append("content", $("#content").val());

        const fileInput = $("#file")[0];
        if (fileInput && fileInput.files[0]) {
          formData.append("file", fileInput.files[0]);
        }

        $.ajax({
          url: "/api/notices/" + noticeId,
          type: "PUT", // 或者是 POST (取決於你的後端設計)
          data: formData,
          processData: false, // 傳送 FormData 必備
          contentType: false, // 傳送 FormData 必備
          success: function (res) {
            alert(res.message || "変更しました。");
            if (!res || res.success !== false) window.location.href = "/brightStaroshirase";
          },
          error: function (xhr) {
            alert("変更に失敗しました。ステータス：" + xhr.status);
          }
        });
      });
    });

    function setForm(item) {
      $("#mainTitle").val(item.mainTitle || "");
      $("#subTitle").val(item.subTitle || "");
      $("#category").val(item.category || "");
      $("#publishDate").val(item.publishDate ? item.publishDate.split("T")[0] : "");
      $("#content").val(item.content || "");

      // 若該筆公告原本就有上傳檔案，顯示出來給使用者看
      if (item.filePath && item.fileName) {
        $("#currentFileLink").attr("href", item.filePath).text(item.fileName);
        $("#currentFileBox").show();
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

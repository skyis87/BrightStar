<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar｜お知らせ編集</title>
  

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}" href="../static/css/common.css">
  <link rel="stylesheet" th:href="@{/css/brightStaroshiraseForm.css}" href="../static/css/brightStaroshiraseForm.css">
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/common.js}" src="../static/js/common.js"></script>
</head>
<body>
  <header class="top d-flex align-items-center justify-content-between">
    <a th:href="@{/portalHome}" href="portalHome.html" class="logo">Brightstar</a>
    <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="back-btn">← 一覧へ戻る</a>
  </header>

  <main class="form-bg">
    <section class="form-box">
      <h1 class="form-title">お知らせ編集</h1>
      <p class="form-text">登録済みのお知らせ内容を変更します。</p>

      <form id="editForm" enctype="multipart/form-data">
        <div class="input-box">
          <label for="mainTitle" class="form-label">タイトル <span class="must">*</span></label>
          <input type="text" id="mainTitle" name="mainTitle" class="form-control" placeholder="タイトルを入力" required>
        </div>

        <div class="input-box">
          <label for="subTitle" class="form-label">サブタイトル</label>
          <input type="text" id="subTitle" name="subTitle" class="form-control" placeholder="サブタイトルを入力（任意）">
        </div>

        <div class="row g-3">
          <div class="col-md-6 input-box">
            <label for="category" class="form-label">分類 <span class="must">*</span></label>
            <input type="text" id="category" name="category" class="form-control" placeholder="例：総務、社内連絡" required>
          </div>
          <div class="col-md-6 input-box">
            <label for="publishDate" class="form-label">公開日 <span class="must">*</span></label>
            <input type="date" id="publishDate" name="publishDate" class="form-control" required>
          </div>
        </div>

        <div class="input-box">
          <label for="content" class="form-label">本文 <span class="must">*</span></label>
          <textarea id="content" name="content" class="form-control" placeholder="お知らせの本文を入力" required></textarea>
        </div>

        <!-- 添付ファイル領域 -->
        <div class="input-box">
          <label class="form-label">添付ファイル</label>
          
          <!-- 1. 現有附件顯示 + 刪除現有附件核取方塊 -->
          <div id="currentFileBox" class="mb-2 p-2 border rounded bg-light" style="font-size: 0.9rem; display: none;">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                現在の添付ファイル：<a id="currentFileLink" href="#" target="_blank" class="fw-bold"></a>
              </div>
              <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" id="deleteCurrentFile" name="deleteCurrentFile" value="true">
                <label class="form-check-label text-danger fw-bold" for="deleteCurrentFile">
                  既存のファイルを削除する
                </label>
              </div>
            </div>
          </div>

          <!-- 2. 上傳新檔案（固定顯示日文「ファイルを選択」與客製化按鈕） -->
          <div class="input-group">
            <label for="file" class="btn custom-file-btn mb-0">ファイルを選択</label>
            <input type="text" id="fileNameDisplay" class="form-control" placeholder="ファイルが選択されていません" readonly>
            <input type="file" id="file" name="file" class="d-none">
            <button type="button" id="clearSelectedFile" class="btn custom-file-btn" style="display: none;">選択解除</button>
          </div>
          <div class="form-text">※新しいファイルを選択した場合、既存のファイルは自動的に上書きされます。</div>
        </div>

        <div class="form-buttons d-flex flex-wrap gap-2 mt-4">
          <button type="submit" class="btn main-btn px-4">変更する</button>
          <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="btn sub-btn px-4">キャンセル</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="bottom d-flex align-items-center justify-content-between">
    <div class="bottom-logo">Brightstar</div>
    <div>© Brightstar</div>
  </footer>

  <script>
    $(function () {
      const noticeId = new URLSearchParams(window.location.search).get("id");

      if (window.location.protocol === "file:") {
        setForm({
          mainTitle: "社内イベント開催のお知らせ",
          subTitle: "参加申込みについて",
          category: "社内連絡",
          publishDate: "2026-09-10",
          content: "社内イベントの開催についてお知らせします。",
          filePath: "#",
          fileName: "sample_notice.pdf"
        });
      } else if (!noticeId) {
        showCustomAlert("お知らせIDがありません。", function () {
          window.location.href = "/brightStaroshirase";
        });
        return;
      } else {
        // 取得原本資料
        $.ajax({
          url: "/api/notices/" + noticeId + "/edit",
          type: "GET",
          success: function (item) {
            if (item) {
              setForm(item);
            } else {
              showCustomAlert("お知らせが見つかりません。");
            }
          },
          error: function () {
            showCustomAlert("お知らせの取得に失敗しました。");
          }
        });
      }

      // 【監控檔案選擇狀態】更新顯示檔名並切換「選択解除」按鈕
      $("#file").on("change", function () {
        if (this.files && this.files.length > 0) {
          $("#fileNameDisplay").val(this.files[0].name);
          $("#clearSelectedFile").show();
        } else {
          $("#fileNameDisplay").val("");
          $("#clearSelectedFile").hide();
        }
      });

      // 【點擊選択解除】清空選取檔案與文字框
      $("#clearSelectedFile").on("click", function () {
        $("#file").val("");
        $("#fileNameDisplay").val("");
        $(this).hide();
      });

      // 提交修改表單
      $("#editForm").on("submit", function (event) {
        event.preventDefault();

        if (window.location.protocol === "file:") {
          showCustomAlert("サンプル画面のため変更処理は行いません。");
          return;
        }

        const formData = new FormData();
        formData.append("mainTitle", $("#mainTitle").val());
        formData.append("subTitle", $("#subTitle").val());
        formData.append("category", $("#category").val());
        formData.append("publishDate", $("#publishDate").val());
        formData.append("content", $("#content").val());

        // 傳送是否刪除原本檔案標記 (true / false)
        const isDeleteCurrent = $("#deleteCurrentFile").is(":checked");
        formData.append("deleteCurrentFile", isDeleteCurrent);

        // 新選取的檔案
        const fileInput = $("#file")[0];
        if (fileInput && fileInput.files[0]) {
          formData.append("file", fileInput.files[0]);
        }

        $.ajax({
          url: "/api/notices/" + noticeId,
          type: "PUT",
          data: formData,
          processData: false,
          contentType: false,
          success: function (res) {
            const msg = (res && res.message) ? res.message : "変更しました。";
            showCustomAlert(msg, function () {
              if (!res || res.success !== false) {
                window.location.href = "/brightStaroshirase";
              }
            });
          },
          error: function (xhr) {
            showCustomAlert("変更に失敗しました。ステータス：" + xhr.status);
          }
        });
      });
    });

    function setForm(item) {
      $("#mainTitle").val(item.mainTitle || "");
      $("#subTitle").val(item.subTitle || "");
      $("#category").val(item.category || "");
      $("#publishDate").val(item.publishDate ? item.publishDate.split("T")[0] : "");
      $("#content").val(item.content || "");

      // 顯示現有檔案
      if (item.filePath && item.fileName) {
        $("#currentFileLink").attr("href", item.filePath).text(item.fileName);
        $("#currentFileBox").show();
      }
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar｜お知らせ詳細</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/common.css}" href="common.css">
  <link rel="stylesheet" th:href="@{/css/brightStaroshirase.css}" href="brightStaroshirase.css">
  <link rel="stylesheet" th:href="@{/css/brightStaroshiraseDetail.css}" href="brightStaroshiraseDetail.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <header class="top d-flex align-items-center justify-content-between">
    <a th:href="@{/portalHome}" href="portalHome.html" class="logo">Brightstar</a>
    <div class="user-box d-flex align-items-center gap-3">
      <span class="user-name" th:text="${session.loginUser != null ? session.loginUser.username : 'ゲスト'}">山田 太郎</span>
      <a th:href="@{/logout}" href="index.html" class="logout">ログアウト</a>
    </div>
  </header>

  <main class="detail-bg">
    <article class="detail-box">
      <div class="detail-top d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="back-btn">← 一覧へ戻る</a>
        
        <!-- 右側按鈕群組 -->
        <div class="d-flex gap-2">
          <!-- 🔽 附件下載按鈕 -->
          <a id="downloadFileBtn" href="#" class="btn main-btn" style="display: none;">添付ファイルをダウンロード</a>
          
          <!-- 原本的文字檔下載按鈕 -->
          <button id="downloadBtn" class="btn sub-btn" style="display: none;">テキストを保存</button>
        </div>
      </div>

      <div id="detailLoading" class="text-secondary text-center py-5">読み込み中...</div>

      <div id="detailContent" style="display: none;">
        <div class="d-flex align-items-center gap-3">
          <span class="tag mb-0" id="detailCategory">News</span>
          <span class="detail-date" id="detailDate"></span>
        </div>
        <h1 class="detail-title" id="detailMainTitle"></h1>
        <div class="detail-sub" id="detailSubTitle" style="display: none;"></div>
        <div class="detail-line"></div>
        <div class="detail-text" id="detailMainContent"></div>
      </div>
    </article>
  </main>

  <footer class="bottom d-flex align-items-center justify-content-between">
    <div class="bottom-logo">Brightstar</div>
    <div>© Brightstar</div>
  </footer>

  <script>
    let currentNotice = null;

    $(function () {
      const noticeId = new URLSearchParams(window.location.search).get("id");

      if (window.location.protocol === "file:") {
        showDetail({
          category: "総務",
          publishDate: "2026-09-16",
          mainTitle: "社内ポータルを公開しました",
          subTitle: "新しいお知らせ画面をご利用いただけます",
          content: "社内ポータルのお知らせ機能を公開しました。\n\n最新情報はこちらからご確認ください。",
          fileName: "sample_doc.pdf",
          filePath: "#"
        });
        return;
      }

      if (!noticeId) {
        alert("お知らせIDがありません。");
        window.location.href = "/brightStaroshirase";
        return;
      }

      $.ajax({
        url: "/api/notices/" + noticeId,
        type: "GET",
        success: function (item) {
          if (item) showDetail(item);
          else moveToList("お知らせが見つかりません。");
        },
        error: function () {
          moveToList("お知らせの取得に失敗しました。");
        }
      });
    });

    function showDetail(item) {
      currentNotice = item;
      $("#detailCategory").text(item.category || "News");
      $("#detailDate").text(item.publishDate || "");
      $("#detailMainTitle").text(item.mainTitle || "");
      $("#detailMainContent").text(item.content || "");
      if (item.subTitle) $("#detailSubTitle").text(item.subTitle).show();

      // 🔽 檢查這篇公告是否有上傳附件檔案
      if (item.filePath && item.fileName) {
        $("#downloadFileBtn")
          .attr("href", item.filePath) // 指向原本的路徑 (例如 /uploads/...)
          .text("添付ファイルをダウンロード：" + item.fileName)
          .show();
      }

      $("#detailLoading").hide();
      $("#detailContent").fadeIn(160);
      $("#downloadBtn").show();
    }

    function moveToList(message) {
      alert(message);
      window.location.href = "/brightStaroshirase";
    }

    // 🔽 新增：使用 JavaScript 攔截附件按鈕點擊，強制用 Blob 下載檔案（不改後端）
    $("#downloadFileBtn").on("click", function (e) {
      e.preventDefault(); // 阻止瀏覽器預設直接打開檔案的行為
      const fileUrl = $(this).attr("href");
      if (!fileUrl || fileUrl === "#") return;

      const fileName = currentNotice ? currentNotice.fileName : "download";

      // 用 fetch 將檔案抓成二進位資料
      fetch(fileUrl)
        .then(response => {
          if (!response.ok) throw new Error("檔案下載失敗");
          return response.blob();
        })
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName; // 強制設定下載檔名
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        })
        .catch(err => {
          console.error(err);
          alert("無法順利下載檔案");
        });
    });

    // 原本的文字檔下載按鈕點擊事件
    $("#downloadBtn").on("click", function () {
      if (!currentNotice) return;
      const text =
        `分類：${currentNotice.category || "News"}\n` +
        `公開日：${currentNotice.publishDate || ""}\n` +
        `タイトル：${currentNotice.mainTitle || ""}\n` +
        (currentNotice.subTitle ? `サブタイトル：${currentNotice.subTitle}\n` : "") +
        "----------------------------------------\n\n" +
        (currentNotice.content || "");
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = (currentNotice.mainTitle || "notice").replace(/[/\\?%*:|"<>]/g, "_") + ".txt";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

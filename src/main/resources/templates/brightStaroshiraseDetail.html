<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar｜公告詳細</title>
  

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}" href="common.css">
  <link rel="stylesheet" th:href="@{/css/brightStaroshirase.css}" href="brightStaroshirase.css">
  <link rel="stylesheet" th:href="@{/css/brightStaroshiraseDetail.css}" href="brightStaroshiraseDetail.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <header class="top d-flex align-items-center justify-content-between">
    <a th:href="@{/portalHome}" href="portalHome.html" class="logo">Brightstar</a>
    <div class="user-box d-flex align-items-center gap-3">
      <span class="user-name" th:text="${session.loginUser != null ? session.loginUser.username : 'ゲスト'}">山田 太郎</span>
      

	  <span class="role" id="roleBadge"
	  				th:text="${session.loginUser != null ? (session.loginUser.role == 'GA' ? '総務' : (session.loginUser.role == 'HR' ? '人事' : '一般')) : '一般'}">一般</span>      
      <a th:href="@{/logout}" href="index.html" class="logout" onclick="localStorage.clear(); sessionStorage.clear();">ログアウト</a>
    </div>
  </header>

  <main class="detail-bg">
    <article class="detail-box">
      <div class="detail-top d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="back-btn">← 一覧へ戻る</a>
        
<!--         右側按鈕群組：下載按鈕 -->
        <div class="d-flex gap-2">
          <!-- 附件下載按鈕 -->
          <a id="downloadFileBtn" href="#" class="btn main-btn" style="display: none;">添付ファイルをダウンロード</a>
          
          <!-- 文字檔儲存按鈕 -->
          <button id="downloadBtn" class="btn sub-btn" style="display: none;">テキストを保存</button>
        </div>
      </div>

      <div id="detailLoading" class="text-secondary text-center py-5">読み込み中...</div>

      <div id="detailContent" style="display: none;">
        <div class="d-flex align-items-center gap-3">
          <span class="tag mb-0" id="detailCategory">News</span>
          <span class="detail-date" id="detailDate"></span>
        </div>
        <h1 class="detail-title" id="detailMainTitle"></h1>
        <div class="detail-sub" id="detailSubTitle" style="display: none;"></div>
        <div class="detail-line"></div>
        
        <!-- 公告內文區域 -->
        <div class="detail-text" id="detailMainContent"></div>

        <!-- 下方的「編輯」「刪除」管理按鈕顯示區域 -->
        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top" id="adminBtnArea" style="display: none !important;">
          <button id="editNoticeBtn" class="btn btn-warning">編集</button>
          <button id="deleteNoticeBtn" class="btn btn-danger">削除</button>
        </div>
      </div>
    </article>
  </main>

  <footer class="bottom d-flex align-items-center justify-content-between">
    <div class="bottom-logo">Brightstar</div>
    <div>© Brightstar</div>
  </footer>

  <script>
    let currentNotice = null;

    $(function () {
      const noticeId = new URLSearchParams(window.location.search).get("id");

      // 本地檔案預覽模式 (file://)
      if (window.location.protocol === "file:") {
        showDetail({
          id: 1,
          category: "総務",
          publishDate: "2026-09-16",
          mainTitle: "社内ポータルを公開しました",
          subTitle: "新しいお知らせ画面をご利用いただけます",
          content: "社内ポータルのお知らせ機能を公開しました。\n\n最新情報はこちらからご確認ください。",
          fileName: "sample_doc.pdf",
          filePath: "#"
        });
        return;
      }

      if (!noticeId) {
        alert("お知らせIDがありません。");
        window.location.href = "/brightStaroshirase";
        return;
      }

      // 取得公告詳細內容 API
      $.ajax({
        url: "/api/notices/" + noticeId,
        type: "GET",
        success: function (item) {
          if (item) showDetail(item);
          else moveToList("お知らせが見つかりません。");
        },
        error: function () {
          moveToList("お知らせの取得に失敗しました。");
        }
      });
    });

    function showDetail(item) {
      currentNotice = item;
      $("#detailCategory").text(item.category || "News");
      $("#detailDate").text(item.publishDate || "");
      $("#detailMainTitle").text(item.mainTitle || "");
      $("#detailMainContent").text(item.content || "");
      if (item.subTitle) $("#detailSubTitle").text(item.subTitle).show();

      // 確認是否存在附件檔案
      if (item.filePath && item.fileName) {
        $("#downloadFileBtn")
          .attr("href", item.filePath)
          .text("添付ファイルをダウンロード：" + item.fileName)
          .show();
      }

      // 權限判定與角色標籤控制
      checkAdminRole();

      $("#detailLoading").hide();
      $("#detailContent").fadeIn(160);
      $("#downloadBtn").show();
    }

    //  2. 角色標籤文字更新 & 管理者專用（編輯、刪除）按鈕顯示控制
    function checkAdminRole() {
      const role = (localStorage.getItem("userRole") || "").toUpperCase();
      
      // 更新角色標籤顯示文字
      let roleText = "一般";
      if (role === "GA") {
        roleText = "総務";
      } else if (role === "HR") {
        roleText = "人事";
      } else if (role === "IT") {
        roleText = "IT";
      }
      $("#roleBadge").text(roleText);

      // 若為 GA (總務) 或 HR (人事) 則顯示編輯與刪除按鈕
      const isAdmin = (role === "GA" || role === "HR");
      if (isAdmin) {
        $("#adminBtnArea").attr("style", "display: flex !important;");
      }
    }

    function moveToList(message) {
      alert(message);
      window.location.href = "/brightStaroshirase";
    }

    // 「編輯」按鈕跳轉邏輯
    $("#editNoticeBtn").on("click", function () {
      if (!currentNotice) return;
      const editPath = window.location.protocol === "file:" 
        ? "brightStaroshiraseEdit.html?id=" 
        : "/brightStaroshirase/edit?id=";
      window.location.href = editPath + currentNotice.id;
    });

    // 「刪除」按鈕處理邏輯
    $("#deleteNoticeBtn").on("click", function () {
      if (!currentNotice) return;
      
      if (!confirm("このお知らせを削除しますか？")) return;

      if (window.location.protocol === "file:") {
        alert("サンプル画面のため削除処理は行いません。");
        return;
      }

      $.ajax({
        url: "/api/notices/" + currentNotice.id,
        type: "DELETE",
        success: function (result) {
          alert("削除しました。");
          window.location.href = "/brightStaroshirase";
        },
        error: function () {
          alert("削除に失敗しました。");
        }
      });
    });

    // 附件下載處理 logic
    $("#downloadFileBtn").on("click", function (e) {
      e.preventDefault();
      const fileUrl = $(this).attr("href");
      if (!fileUrl || fileUrl === "#") return;

      const fileName = currentNotice ? currentNotice.fileName : "download";

      fetch(fileUrl)
        .then(response => {
          if (!response.ok) throw new Error("下載失敗");
          return response.blob();
        })
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        })
        .catch(err => {
          console.error(err);
          alert("無法下載檔案。");
        });
    });

    // 文字檔匯出儲存處理 logic
    $("#downloadBtn").on("click", function () {
      if (!currentNotice) return;
      const text =
        `分類：${currentNotice.category || "News"}\n` +
        `公開日：${currentNotice.publishDate || ""}\n` +
        `タイトル：${currentNotice.mainTitle || ""}\n` +
        (currentNotice.subTitle ? `サブタイトル：${currentNotice.subTitle}\n` : "") +
        "----------------------------------------\n\n" +
        (currentNotice.content || "");
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = (currentNotice.mainTitle || "notice").replace(/[/\\?%*:|"<>]/g, "_") + ".txt";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

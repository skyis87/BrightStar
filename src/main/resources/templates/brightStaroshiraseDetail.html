<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightstar - お知らせ詳細</title>
    <!-- 引入共用樣式與詳細頁專屬樣式 -->
    <link rel="stylesheet" th:href="@{/css/brightStaroshirase.css}" href="/css/brightStaroshirase.css">
    <link rel="stylesheet" th:href="@{/css/brightStaroshiraseDetail.css}" href="/css/brightStaroshiraseDetail.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- 頁面頂端導覽列 -->
    <header class="header">
        <div class="brand">
            <span>Brightstar</span>
        </div>
        <div class="header-right">
            <!-- 顯示登入使用者名稱，若未登入則顯示「ユーザー」 -->
            <span class="user-name" th:text="${session.loginUser != null ? session.loginUser.username : 'ユーザー'}">ユーザー</span>
            <a th:href="@{/logout}" class="logout-btn">ログアウト</a>
        </div>
    </header>

    <main>
        <div class="detail-container">
            <!-- 返回按鈕與 TXT 下載按鈕區塊 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <a href="/brightStaroshirase" class="back-link" style="margin-bottom: 0;">← お知らせ一覧に戻る</a>
                <!-- TXT 下載按鈕（預設隱藏，資料載入後顯示） -->
                <button id="downloadBtn" class="admin-btn light" style="display: none;">お知らせをダウンロード (TXT)</button>
            </div>

            <!-- 載入中提示 -->
            <div id="detailLoading" style="text-align: center; color: var(--sub); padding: 40px;">
                読み込み中...
            </div>

            <!-- 公告詳細內容包裝區塊（預設隱藏） -->
            <div id="detailContentWrapper" style="display: none;">
                <div class="detail-meta">
                    <span class="notice-label" id="detailCategory" style="margin-bottom: 0;">News</span>
                    <span id="detailDate">2026-09-16</span>
                </div>

                <h1 class="detail-main-title" id="detailMainTitle">大見出し読み込み中</h1>
                <div class="detail-sub-title" id="detailSubTitle" style="display: none;">小見出し</div>

                <div class="detail-divider"></div>

                <!-- 公告內文區域 -->
                <div class="detail-content" id="detailMainContent">
                    詳細内容読み込み中...
                </div>
                
                <!-- 附件檔案下載區塊 -->
                <div id="attachmentSection" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; display: none;">
                    <div style="font-weight: bold; margin-bottom: 8px; color: #555;">添付ファイル：</div>
                    <a id="fileDownloadLink" href="#" target="_blank" class="admin-btn light" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none;">
                        📥 添付ファイルをダウンロード
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="footer">
        <div class="footer-brand">Brightstar</div>
        <div>©Brightstar</div>
    </footer>

    <script>
        let currentNotice = null;

        $(document).ready(function() {
            // 1. 取得網址列中的 id 參數
            const urlParams = new URLSearchParams(window.location.search);
            const noticeId = urlParams.get('id');

            // 若沒有帶 id 則跳出警告並導回列表頁
            if (!noticeId) {
                alert('お知らせのIDがありません！');
                window.location.href = '/brightStaroshirase';
                return;
            }

            // 2. 發送 AJAX 取得單筆公告詳細資料
            $.ajax({
                url: '/api/notices/' + noticeId,
                type: 'GET',
                success: function(item) {
                    if (item) {
                        currentNotice = item;
                        $('#downloadBtn').show(); // 顯示文字檔下載按鈕

                        // 填入各欄位資料
                        $('#detailCategory').text(item.category || 'News');
                        $('#detailDate').text(item.publishDate || '');
                        $('#detailMainTitle').text(item.mainTitle || '');
                        
                        if (item.subTitle) {
                            $('#detailSubTitle').text(item.subTitle).show();
                        }
                        
                        $('#detailMainContent').text(item.content || '');
                        
                        // 3. 檢查是否有上傳附件檔案，若有則顯示下載連結
                        if (item.filePath && item.fileName) {
                            $('#fileDownloadLink')
                                .attr('href', item.filePath)
                                .attr('download', item.fileName)
                                .text('📥 添付ファイルをダウンロード：' + item.fileName);
                            $('#attachmentSection').show();
                        } else {
                            $('#attachmentSection').hide();
                        }
                        
                        // 隱藏載入動畫，顯示內容
                        $('#detailLoading').hide();
                        $('#detailContentWrapper').fadeIn(200);
                    } else {
                        alert('指定されたお知らせが見つかりません');
                        window.location.href = '/brightStaroshirase';
                    }
                },
                error: function() {
                    alert('お知らせ詳細の読み込みに失敗しました。');
                    window.location.href = '/brightStaroshirase';
                }
            });
        });

        // 4. 點擊 TXT 下載按鈕的事件處理
        $('#downloadBtn').click(function() {
            if (!currentNotice) return;

            // 組裝要匯出的文字內容
            const fileContent = 
                `カテゴリ：${currentNotice.category || 'News'}\n` +
                `公開日：${currentNotice.publishDate || ''}\n` +
                `大見出し：${currentNotice.mainTitle || ''}\n` +
                (currentNotice.subTitle ? `小見出し：${currentNotice.subTitle}\n` : '') +
                `----------------------------------------\n\n` +
                `${currentNotice.content || ''}`;

            // 建立 Blob 物件與暫時下載連結
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            const safeTitle = (currentNotice.mainTitle || 'notice').replace(/[/\\?%*:|"<>]/g, '_');
            a.download = `${safeTitle}.txt`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>

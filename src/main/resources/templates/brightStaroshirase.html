<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar - 公告首頁</title>
  <link rel="stylesheet" th:href="@{/css/brightStaroshirase.css}" href="/css/brightStaroshirase.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark"></div>
      <span>Brightstar</span>
    </div>

    <div class="header-right">
      <span class="user-name" th:text="${session.loginUser != null ? session.loginUser.username : '使用者'}">使用者</span>
      
      <span class="role-badge" id="roleBadge" 
            th:text="${session.loginUser != null && (session.loginUser.role == 'HR' || session.loginUser.role == 'GA') ? (session.loginUser.role == 'HR' ? '人事' : '総務') : '一般'}">一般</span>
      
      <a th:href="@{/logout}" class="logout-btn">ログアウト</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-image">
        MAIN IMAGE
      </div>

      <div class="hero-copy">
        <div class="hero-kicker">BRIGHTSTAR INTERNAL PORTAL</div>
        <h1 class="hero-title">Information</h1>
        <div class="hero-line"></div>
        <p class="hero-desc">
          Brightstarからのお知らせを掲載しています。<br>
          社内の最新情報をご確認ください。
        </p>
      </div>
    </section>

    <!-- 最新のお知らせ區塊 (動態渲染) -->
    <div class="latest-wrap">
      <section class="section">
        <div class="section-head">
          <div class="section-title-wrap">
            <div class="section-jp">最新のお知らせ</div>
            <h2 class="section-title">Latest</h2>
          </div>

          <!-- HR / GA 專用新增與管理按鈕：點擊連結至獨立表單頁 /brightStaroshirase/form -->
          <div class="admin-only admin-tools" style="display: none;">
            <a href="/brightStaroshirase/form" class="admin-btn primary">＋ 新規作成</a>
          </div>
        </div>

        <div id="latestNoticeContainer">
          <!-- JS 動態載入最新公告 -->
        </div>
      </section>
    </div>

    <!-- 過去のお知らせ區塊 (動態渲染) -->
    <section class="section">
      <div class="section-head">
        <div class="section-title-wrap">
          <div class="section-jp">過去のお知らせ</div>
          <h2 class="section-title">Archive</h2>
        </div>
      </div>

      <div class="notice-grid" id="archiveNoticeGrid">
        <!-- JS 動態載入歷史公告 -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-brand">Brightstar</div>
    <div>©Brightstar</div>
  </footer>

  <script>
    $(document).ready(function() {
      // 1. 權限判斷
      const userRole = (localStorage.getItem("userRole") || "").toUpperCase();
      const isAdminGroup = (userRole === "HR" || userRole === "GA");

      document.querySelectorAll(".admin-only").forEach(item => {
        item.style.display = isAdminGroup ? "" : "none";
      });

      const roleBadge = document.getElementById("roleBadge");
      if (roleBadge) {
        if (userRole === "HR") roleBadge.textContent = "人事";
        else if (userRole === "GA") roleBadge.textContent = "総務";
        else roleBadge.textContent = "一般";
      }

      // 2. 載入資料庫公告
      loadNotices();
    });

    function loadNotices() {
      $.ajax({
        url: '/api/notices',
        type: 'GET',
        success: function(data) {
          const userRole = (localStorage.getItem("userRole") || "").toUpperCase();
          const isAdminGroup = (userRole === "HR" || userRole === "GA");

          if (!data || data.length === 0) {
            $('#latestNoticeContainer').html('<p style="color:#666;">目前沒有公告資訊。</p>');
            $('#archiveNoticeGrid').html('');
            return;
          }

          // 假設陣列第一筆是最新，其餘為歷史
          const latestItem = data[0];
          const archiveItems = data.slice(1);

          // 渲染 Latest
          const deleteBtnHtml = isAdminGroup 
            ? `<button class="mini-btn delete" onclick="deleteNotice(${latestItem.id})">削除</button>` 
            : '';

          const latestHtml = `
            <article class="latest-card">
              <div class="latest-image">LATEST IMAGE</div>
              <div class="latest-body">
                <span class="notice-label">${latestItem.category || 'News'}</span>
                <div class="notice-date">${latestItem.publishDate || ''}</div>
                <h3 class="latest-title">${latestItem.mainTitle}</h3>
                ${latestItem.subTitle ? `<p style="color:#666; font-size:13px; margin:0 0 12px;">${latestItem.subTitle}</p>` : ''}
                <p class="latest-text">${latestItem.content}</p>
                <a href="#" class="read-more">Read More <span></span> →</a>
                ${isAdminGroup ? `<div style="margin-top:24px;">${deleteBtnHtml}</div>` : ''}
              </div>
            </article>
          `;
          $('#latestNoticeContainer').html(latestHtml);

          // 渲染 Archive
          let archiveHtml = '';
          archiveItems.forEach(function(item) {
            const archiveDelBtn = isAdminGroup 
              ? `<button class="mini-btn delete" onclick="deleteNotice(${item.id})">削除</button>` 
              : '';

            archiveHtml += `
              <article class="notice-card">
                <div class="notice-icon">
                  <div class="icon-circle">📢</div>
                </div>
                <div class="notice-body">
                  <div class="notice-meta">
                    <span>${item.category || 'News'}</span>
                    <span>${item.publishDate || ''}</span>
                  </div>
                  <h3 class="notice-title">${item.mainTitle}</h3>
                </div>
                ${isAdminGroup ? `<div class="card-admin">${archiveDelBtn}</div>` : ''}
              </article>
            `;
          });
          $('#archiveNoticeGrid').html(archiveHtml);
        },
        error: function(err) {
          console.error("載入公告失敗:", err);
        }
      });
    }

    function deleteNotice(id) {
      if (!confirm('本当にこのお知らせを削除しますか？')) return;

      $.ajax({
        url: '/api/notices/' + id,
        type: 'DELETE',
        success: function() {
          alert('削除しました。');
          loadNotices();
        },
        error: function() {
          alert('削除に失敗しました。');
        }
      });
    }
  </script>
</body>
</html>

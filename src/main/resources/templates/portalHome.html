<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Brightstar｜社内ポータル</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/common.css}" href="common.css">
	<link rel="stylesheet" th:href="@{/css/portalHome.css}" href="portalHome.css">
</head>

<body>
	<header class="top d-flex align-items-center justify-content-between">
		<a th:href="@{/portalHome}" href="portalHome.html" class="logo">Brightstar</a>
		<div class="user-box d-flex align-items-center gap-3">
			<span class="user-name" th:text="${session.loginUser != null ? session.loginUser.username : 'ゲスト'}">山田
				太郎</span>


			<span class="role" id="roleBadge"
				th:text="${session.loginUser != null ? (session.loginUser.role == 'GA' ? '総務' : (session.loginUser.role == 'HR' ? '人事' : '一般')) : '一般'}">一般</span>

			<a th:href="@{/logout}" href="index.html" class="logout"
				onclick="localStorage.clear(); sessionStorage.clear();">ログアウト</a>
		</div>
	</header>

	<main>
		<section class="main-box page-width">
			<div class="row align-items-center g-4 g-lg-5">
				<div class="col-lg-7">
					<div class="main-photo">
						<img th:src="@{/images/main.jpg}" src="images/main.jpg" alt="Brightstar メインビジュアル">
					</div>
				</div>
				<div class="col-lg-5">
					<div class="small-title">WELCOME TO BRIGHTSTAR</div>
					<h1 class="big-title">Portal</h1>
					<div class="black-line"></div>
					<p class="main-text">社内のお知らせや各種メニューを確認できます。<br>利用する機能を選択してください。</p>
				</div>
			</div>
		</section>

		<section class="content-box page-width">
			<div class="content-head">
				<p class="jp-title">主要機能</p>
				<h2 class="en-title">Services</h2>
			</div>

			<div class="menu-list">
				<a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="menu-card card">
					<div class="menu-photo">
						<img th:src="@{/images/notice01.png}" src="images/notice01.png" alt="お知らせ">
					</div>
					<div class="menu-info">
						<div class="menu-tag">INFORMATION</div>
						<h3 class="menu-name">社内お知らせ</h3>
						<p class="menu-text">全社連絡、イベント情報、各部署からのお知らせを確認できます。</p>
					</div>
				</a>

				<div class="menu-card card off">
					<div class="menu-photo gray">01</div>
					<div class="menu-info">
						<div class="menu-tag">ATTENDANCE</div>
						<h3 class="menu-name">勤怠管理</h3>
						<p class="menu-text">出退勤、有給休暇申請、勤務実績の確認機能は準備中です。</p>
					</div>
				</div>

				<div class="menu-card card off">
					<div class="menu-photo gray">02</div>
					<div class="menu-info">
						<div class="menu-tag">DOCUMENTS</div>
						<h3 class="menu-name">社内フォーマット</h3>
						<p class="menu-text">申請書、マニュアル等の閲覧・ダウンロード機能は準備中です。</p>
					</div>
				</div>
			</div>
		</section>
	</main>

	<footer class="bottom d-flex align-items-center justify-content-between">
		<div class="bottom-logo">Brightstar</div>
		<div>© Brightstar</div>
	</footer>


	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const role = (localStorage.getItem("userRole") || "").toUpperCase();
			const roleBadge = document.getElementById("roleBadge");

			if (roleBadge) {
				let roleText = "一般";
				if (role === "GA") {
					roleText = "総務";
				} else if (role === "HR") {
					roleText = "人事";
				}
				roleBadge.textContent = roleText;
			}
		});
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Brightstar - 公告首頁</title>
	<link rel="stylesheet" th:href="@{/css/brightStaroshirase.css}" href="/css/brightStaroshirase.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
	<header class="header">
	        <!-- 將 brand 包在 a 標籤內，點擊即可回首頁 -->
	        <a th:href="@{/portalHome}" href="/portalHome" class="brand" style="text-decoration: none; color: inherit;">

	            <span>Brightstar</span>
	        </a>
	        <div class="header-right">
	            <span class="user-name" th:text="${session.loginUser != null ? session.loginUser.username : '使用者'}">使用者</span>
	            <a th:href="@{/logout}" class="logout-btn">ログアウト</a>
	        </div>
	    </header>

	<main>
		<section class="hero">
			<div class="hero-image">
				MAIN IMAGE
			</div>

			<div class="hero-copy">
				<div class="hero-kicker">BRIGHTSTAR INTERNAL PORTAL</div>
				<h1 class="hero-title">Information</h1>
				<div class="hero-line"></div>
				<p class="hero-desc">
					Brightstarからのお知らせを掲載しています。<br>
					社内の最新情報をご確認ください。
				</p>
			</div>
		</section>

		<!-- 最新のお知らせ區塊 (動態渲染) -->
		<div class="latest-wrap">
			<section class="section">
				<div class="section-head">
					<div class="section-title-wrap">
						<div class="section-jp">最新のお知らせ</div>
						<h2 class="section-title">Latest</h2>
					</div>

					<!-- HR / GA 專用新增按鈕：導向 /brightStaroshirase/create -->
					<div class="admin-only admin-tools" style="display: none;">
						<a href="/brightStaroshirase/form" class="admin-btn primary">＋ 新規作成</a>
					</div>
				</div>

				<div id="latestNoticeContainer">
					<!-- JS 動態載入最新公告 -->
				</div>
			</section>
		</div>

		<!-- 過去のお知らせ區塊 (動態渲染) -->
		<section class="section">
			<div class="section-head">
				<div class="section-title-wrap">
					<div class="section-jp">過去のお知らせ</div>
					<h2 class="section-title">Archive</h2>
				</div>
			</div>

			<div class="notice-grid" id="archiveNoticeGrid">
				<!-- JS 動態載入歷史公告 -->
			</div>
		</section>
	</main>

	<footer class="footer">
		<div class="footer-brand">Brightstar</div>
		<div>©Brightstar</div>
	</footer>

	<script>
		$(document).ready(function () {
			// 1. 權限判斷
			const userRole = (localStorage.getItem("userRole") || "").toUpperCase();
			const isAdminGroup = (userRole === "HR" || userRole === "GA");

			document.querySelectorAll(".admin-only").forEach(item => {
				item.style.display = isAdminGroup ? "" : "none";
			});

			const roleBadge = document.getElementById("roleBadge");
			if (roleBadge) {
				if (userRole === "HR") roleBadge.textContent = "人事";
				else if (userRole === "GA") roleBadge.textContent = "総務";
				else roleBadge.textContent = "一般";
			}

			// 2. 載入資料庫公告
			loadNotices();
		});

		function loadNotices() {
			$.ajax({
				url: '/api/notices',
				type: 'GET',
				success: function (data) {
					const userRole = (localStorage.getItem("userRole") || "").toUpperCase();
					const isAdminGroup = (userRole === "HR" || userRole === "GA");

					if (!data || data.length === 0) {
						$('#latestNoticeContainer').html('<p style="color:#666;">目前沒有公告資訊。</p>');
						$('#archiveNoticeGrid').html('');
						return;
					}

					// 取得今天的日期字串 (YYYY-MM-DD)，用來比對是不是未來公告
					const todayStr = new Date().toISOString().split('T')[0];

					// 假設陣列第一筆是最新，其餘為歷史
					const latestItem = data[0];
					const archiveItems = data.slice(1);

					// 判斷是否為未來尚未發布的公告
					const isLatestFuture = latestItem.publishDate && latestItem.publishDate > todayStr;
					const statusBadgeHtml = isLatestFuture
						? `<span class="status-badge">【予約中・未發布】</span>`
						: '';

					// 渲染 Latest 按鈕與卡片
					const editBtnHtml = isAdminGroup
						? `<button class="mini-btn edit" onclick="editNotice(${latestItem.id})">編集</button>`
						: '';
					const deleteBtnHtml = isAdminGroup
						? `<button class="mini-btn delete" onclick="deleteNotice(${latestItem.id})">削除</button>`
						: '';

						const latestHtml = `
						  <article class="latest-card" onclick="location.href='/brightStaroshirase/detail?id=${latestItem.id}'" style="cursor: pointer;">
						    <div class="latest-image">LATEST IMAGE</div>
						    <div class="latest-body">
						      <span class="notice-label">${latestItem.category || 'News'}</span>
						      <div class="notice-date">
						        ${latestItem.publishDate || ''} ${statusBadgeHtml}
						      </div>
						      <h3 class="latest-title">${latestItem.mainTitle}</h3>
						      ${latestItem.subTitle ? `<p style="color:#666; font-size:13px; margin:0 0 12px;">${latestItem.subTitle}</p>` : ''}
						      <p class="latest-text">${latestItem.content}</p>
						      <a href="/brightStaroshirase/detail?id=${latestItem.id}" class="read-more">Read More <span></span> →</a>
						      ${isAdminGroup ? `<div style="margin-top:24px; display:flex; gap:8px;" onclick="event.stopPropagation();">${editBtnHtml} ${deleteBtnHtml}</div>` : ''}
						    </div>
						  </article>
						`;
					$('#latestNoticeContainer').html(latestHtml);

					// 渲染 Archive 按鈕與卡片
					let archiveHtml = '';
					archiveItems.forEach(function (item) {
						const isArchiveFuture = item.publishDate && item.publishDate > todayStr;
						const archiveBadgeHtml = isArchiveFuture
							? `<span class="status-badge archive">【予約中】</span>`
							: '';
						const archiveEditBtn = isAdminGroup
							? `<button class="mini-btn edit" onclick="editNotice(${item.id})">編集</button>`
							: '';
						const archiveDelBtn = isAdminGroup
							? `<button class="mini-btn delete" onclick="deleteNotice(${item.id})">削除</button>`
							: '';

							archiveHtml += `
							    <article class="notice-card" onclick="location.href='/brightStaroshirase/detail?id=${item.id}'" style="cursor: pointer;">
							      <div class="notice-icon">
							        <div class="icon-circle">📢</div>
							      </div>
							      <div class="notice-body">
							        <div class="notice-meta">
							          <span>${item.category || 'News'}</span>
							          <span>${item.publishDate || ''} ${archiveBadgeHtml}</span>
							        </div>
							        <h3 class="notice-title">${item.mainTitle}</h3>
							      </div>
							      ${isAdminGroup ? `
							        <div class="card-admin" style="display:flex; gap:8px;" onclick="event.stopPropagation();">
							          ${archiveEditBtn} ${archiveDelBtn}
							        </div>
							      ` : ''}
							    </article>
							`;
					});
					$('#archiveNoticeGrid').html(archiveHtml);
				},
				error: function (err) {
					console.error("載入公告失敗:", err);
				}
			});
		}

		// 點擊編輯：導向獨立的編輯頁面並帶入 id
		function editNotice(id) {
			window.location.href = '/brightStaroshirase/edit?id=' + id;
		}

		// 刪除公告函式
		function deleteNotice(id) {
			if (!confirm('本当にこのお知らせを削除しますか？')) return;

			$.ajax({
				url: '/api/notices/' + id,
				type: 'DELETE',
				success: function () {
					alert('削除しました。');
					loadNotices();
				},
				error: function () {
					alert('削除に失敗しました。');
				}
			});
		}
	</script>
</body>

</html>

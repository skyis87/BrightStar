<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BrightStar - お知らせ投稿</title>
    <link rel="stylesheet" th:href="@{/css/brightStaroshiraseForm.css}" href="/css/brightStaroshiraseForm.css">
    <link rel="stylesheet" th:href="@{/css/portalHome.css}" href="/css/portalHome.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="portal-container">
        <header class="portal-header">
            <h1>お知らせ投稿</h1>
            <div class="user-actions">
                <a href="/brightStaroshirase" class="btn-back">お知らせ一覧に戻る</a>
            </div>
        </header>

        <div class="form-container">
            <!-- 加上 enctype="multipart/form-data" 確保表單能傳送檔案 -->
            <form id="noticeForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>大見出し <span class="required">*</span></label>
                    <input type="text" id="mainTitle" name="mainTitle" placeholder="大見出しを入力してください" required>
                </div>

                <div class="form-group">
                    <label>小見出し</label>
                    <input type="text" id="subTitle" name="subTitle" placeholder="小見出しを入力してください（任意）">
                </div>

                <div class="form-group">
                    <label>カテゴリ <span class="required">*</span></label>
                    <input type="text" id="category" name="category" placeholder="例: GA, HR, システム" required>
                </div>

                <div class="form-group">
                    <label>公開日 <span class="required">*</span></label>
                    <input type="date" id="publishDate" name="publishDate" required>
                </div>

                <div class="form-group">
                    <label>お知らせ内容 <span class="required">*</span></label>
                    <textarea id="content" name="content" placeholder="詳細な内容を入力してください..." rows="8" required></textarea>
                </div>

                <!-- 🔽 新增：附件上傳欄位 -->
                <div class="form-group">
                    <label>添付ファイル（任意）</label>
                    <input type="file" id="file" name="file">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-confirm">確定</button>
                    <a href="/brightStaroshirase" class="btn-cancel">キャンセル</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // 預設發布日期帶入今天
            const today = new Date().toISOString().split('T')[0];
            $('#publishDate').val(today);

            // 表單提交
            $('#noticeForm').submit(function(e) {
                e.preventDefault();
                
                // 使用 FormData 自動打包表單內的所有欄位（包含文字與檔案）
                const formData = new FormData(this);

                $.ajax({
                    url: '/api/notices',
                    type: 'POST',
                    data: formData,
                    // 傳送 FormData 時，這兩個設定必須為 false，瀏覽器才會正確處理多部分表單資料
                    processData: false,
                    contentType: false,
                    success: function(res) {
                        alert(res.message);
                        if (res.success) {
                            window.location.href = '/brightStaroshirase'; // 成功後跳轉回列表頁
                        }
                    },
                    error: function() {
                        alert('投稿に失敗しました。ネットワークまたはサーバーの状態を確認してください。');
                    }
                });
            });
        });
    </script>
</body>
</html>

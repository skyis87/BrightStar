 <!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightstar｜お知らせ新規作成</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/common.css}" href="../static/css/common.css">
  <link rel="stylesheet" th:href="@{/css/brightStaroshiraseForm.css}" href="../static/css/brightStaroshiraseForm.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/common.js}" src="../static/js/common.js"></script>
</head>
<body>
  <header class="top d-flex align-items-center justify-content-between">
    <a th:href="@{/portalHome}" href="portalHome.html" class="logo">Brightstar</a>
    <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="back-btn">← 一覧へ戻る</a>
  </header>

  <main class="form-bg">
    <section class="form-box">
      <h1 class="form-title">お知らせ新規作成</h1>
      <p class="form-text">社内に公開するお知らせを入力してください。</p>

      <form id="noticeForm" enctype="multipart/form-data">
        <div class="input-box">
          <label for="mainTitle" class="form-label">タイトル <span class="must">*</span></label>
          <input type="text" id="mainTitle" name="mainTitle" class="form-control" placeholder="タイトルを入力" required>
        </div>

        <div class="input-box">
          <label for="subTitle" class="form-label">サブタイトル</label>
          <input type="text" id="subTitle" name="subTitle" class="form-control" placeholder="サブタイトルを入力（任意）">
        </div>

        <div class="row g-3">
          <div class="col-md-6 input-box">
            <label for="category" class="form-label">分類 <span class="must">*</span></label>
            <input type="text" id="category" name="category" class="form-control" placeholder="例：総務、社内連絡" required>
          </div>
          <div class="col-md-6 input-box">
            <label for="publishDate" class="form-label">公開日 <span class="must">*</span></label>
            <input type="date" id="publishDate" name="publishDate" class="form-control" required>
          </div>
        </div>

        <div class="input-box">
          <label for="content" class="form-label">本文 <span class="must">*</span></label>
          <textarea id="content" name="content" class="form-control" placeholder="お知らせの本文を入力" required></textarea>
        </div>

        <!-- 添付ファイル領域（固定デザイン＋ボタン統一） -->
        <div class="input-box">
          <label class="form-label">添付ファイル（任意）</label>
          <div class="input-group">
            <label for="file" class="btn custom-file-btn mb-0">ファイルを選択</label>
            <input type="text" id="fileNameDisplay" class="form-control" placeholder="ファイルが選択されていません" readonly>
            <input type="file" id="file" name="file" class="d-none">
            <button type="button" id="clearSelectedFile" class="btn custom-file-btn" style="display: none;">選択解除</button>
          </div>
        </div>

        <div class="form-buttons d-flex flex-wrap gap-2 mt-4">
          <button type="submit" class="btn main-btn px-4">登録する</button>
          <a th:href="@{/brightStaroshirase}" href="brightStaroshirase.html" class="btn sub-btn px-4">キャンセル</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="bottom d-flex align-items-center justify-content-between">
    <div class="bottom-logo">Brightstar</div>
    <div>© Brightstar</div>
  </footer>

  <script>
    $(function () {
      // 【ファイル選択状態の監視】ファイル名の表示と「選択解除」ボタンの表示切り替え
      $("#file").on("change", function () {
        if (this.files && this.files.length > 0) {
          $("#fileNameDisplay").val(this.files[0].name);
          $("#clearSelectedFile").show();
        } else {
          $("#fileNameDisplay").val("");
          $("#clearSelectedFile").hide();
        }
      });

      // 【選択解除ボタンの処理】選択されたファイルと表示をクリア
      $("#clearSelectedFile").on("click", function () {
        $("#file").val("");
        $("#fileNameDisplay").val("");
        $(this).hide();
      });

      // フォーム送信処理
      $("#noticeForm").on("submit", function (event) {
        event.preventDefault();

        if (window.location.protocol === "file:") {
          showCustomAlert("サンプル画面のため登録処理は行いません。");
          return;
        }

        const formData = new FormData();
        formData.append("mainTitle", $("#mainTitle").val());
        formData.append("subTitle", $("#subTitle").val());
        formData.append("category", $("#category").val());
        formData.append("publishDate", $("#publishDate").val());
        formData.append("content", $("#content").val());

        const fileInput = $("#file")[0];
        if (fileInput && fileInput.files[0]) {
          formData.append("file", fileInput.files[0]);
        }

        $.ajax({
          url: "/api/notices",
          type: "POST",
          data: formData,
          processData: false,
          contentType: false,
          success: function (res) {
            if (res && res.success) {
              const msg = res.message || "登録しました。";
              showCustomAlert(msg, function () {
                window.location.href = "/brightStaroshirase";
              });
            } else {
              showCustomAlert("登録に失敗しました：" + (res.message || ""));
            }
          },
          error: function (xhr) {
            showCustomAlert("登録に失敗しました。ステータス：" + xhr.status);
          }
        });
      });
    });
  </script>
</body>
</html>
